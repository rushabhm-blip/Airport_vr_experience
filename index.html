<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f33">
<title>Saath · Airport practice (Mixed Reality)</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body>
<div id="canvas-host"></div>

<div id="loading">Loading Saath airport practice…</div>

<main id="launcher">
  <div class="card">
    <img class="hero" src="assets/images/keyart.jpg" alt="" onerror="this.remove()">
    <div class="head">
      <div class="brand">saath</div>
      <h1>Rehearse your journey.</h1>
      <p class="lead">Calm, untimed airport practice at home.</p>
    </div>
    <input id="name-input" type="text" maxlength="24" placeholder="Your name" aria-label="Your name, shown on your boarding pass" autocomplete="given-name" enterkeyhint="done">
    <button id="btn-mr" class="primary off">Start in mixed reality</button>
    <div class="row">
      <button id="btn-vr" class="secondary off">Full VR</button>
      <button id="btn-webcam" class="secondary">Webcam preview</button>
    </div>
    <div class="row links">
      <button id="btn-tour" class="ghost">Watch the journey</button>
      <button id="btn-desktop" class="ghost">Desktop preview</button>
    </div>
    <p class="tips">Sit or stand where you are. Move with the thumbstick.</p>
    <p id="cap" class="cap">Checking headset support…</p>
    <p id="build" class="cap"></p>
    <p id="err" class="err"></p>
  </div>
</main>

<div id="hud" hidden>Desktop preview · click buttons · drag props · drag empty space to look · ← → change step · Esc menu</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
